<app-floating-configurator />

<div
  class="bg-surface-50 dark:bg-surface-950 flex items-center justify-center min-h-screen min-w-screen overflow-hidden"
>
  <div class="flex flex-col items-center justify-center">
    
    <!-- Gradient wrapper -->
    <div
      style="
        border-radius: 56px;
        padding: 0.3rem;
        background: linear-gradient(
          180deg,
          var(--primary-color) 10%,
          rgba(33, 150, 243, 0) 30%
        );
      "
    >
      <!-- Card -->
      <div
        class="w-full bg-surface-0 dark:bg-surface-900 py-12 px-8 sm:px-12"
        style="border-radius: 53px; min-width: 420px; max-width: 480px"
      >
        <!-- HEADER -->
        <div class="text-center mb-6">
          <h2 class="text-surface-900 dark:text-surface-0 text-3xl font-medium mb-2">
            Welcome Back
          </h2>
          <span class="text-muted-color">Sign in to continue</span>
        </div>

        <!-- FORM -->
        <form
          [formGroup]="form"
          (ngSubmit)="login()"
          class="flex flex-col gap-4"
        >
          <!-- EMAIL -->
          <div class="flex flex-col gap-1">
            <label class="font-medium">Email</label>
            <input
              pInputText
              type="email"
              formControlName="email"
              placeholder="Enter email"
            />
          </div>

          <!-- PASSWORD -->
          <div class="flex flex-col gap-1">
            <label class="font-medium">Password</label>
            <p-password
              formControlName="password"
              placeholder="Enter password"
              [toggleMask]="true"
              [feedback]="false"
              styleClass="w-full"
              inputStyleClass="w-full"
            />
          </div>

          <!-- REMEMBER + FORGOT -->
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-2">
              <p-checkbox binary formControlName="rememberMe"></p-checkbox>
              <label class="text-600">Remember me</label>
            </div>

            <a
              class="font-medium text-primary cursor-pointer"
              (click)="goToForgot()"
            >
              Forgot password?
            </a>
          </div>

          <!-- SUBMIT -->
          <p-button
            type="submit"
            label="Sign In"
            icon="pi pi-sign-in"
            styleClass="w-full"
            [loading]="loading"
            [disabled]="form.invalid"
          ></p-button>

          <p-message
            *ngIf="serverError"
            severity="error"
            [text]="serverError"
          ></p-message>

          <p class="text-center text-600">
            Don’t have an account?
            <a
              class="font-medium text-primary cursor-pointer ml-1"
              (click)="goToRegister()"
            >
              Register
            </a>
          </p>
        </form>

        <!-- DIVIDER -->
        <div class="flex items-center my-6">
          <div class="flex-grow border-top-1 surface-border"></div>
          <span class="mx-3 text-600">OR</span>
          <div class="flex-grow border-top-1 surface-border"></div>
        </div>

        <!-- SOCIAL -->
        <div class="flex flex-col gap-3">
          <p-button
            label="Continue with Google"
            icon="pi pi-google"
            styleClass="p-button-outlined w-full"
            (onClick)="loginWithGoogle()"
          ></p-button>

          <p-button
            label="Continue with Facebook"
            icon="pi pi-facebook"
            styleClass="p-button-outlined w-full p-button-secondary"
            (onClick)="loginWithFacebook()"
          ></p-button>
        </div>
      </div>
    </div>
  </div>
</div>
