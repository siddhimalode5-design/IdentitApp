<app-floating-configurator />

<div
  class="bg-surface-50 dark:bg-surface-950 flex items-center justify-center min-h-screen min-w-screen overflow-hidden"
>
  <div class="flex flex-col items-center justify-center">

    <!-- Gradient Wrapper -->
    <div
      style="
        border-radius: 56px;
        padding: 0.3rem;
        background: linear-gradient(
          180deg,
          var(--primary-color) 10%,
          rgba(33, 150, 243, 0) 30%
        );
      "
    >
      <!-- Card -->
      <div
        class="bg-surface-0 dark:bg-surface-900 px-10 py-12 text-center"
        style="border-radius: 53px; min-width: 420px; max-width: 500px"
      >

        <!-- ICON -->
        <i
          class="pi pi-exclamation-triangle text-primary mb-4"
          style="font-size: 4rem"
        ></i>

        <!-- TITLE -->
        <h1
          class="text-surface-900 dark:text-surface-0 text-4xl font-bold mb-3"
        >
          404
        </h1>

        <h2
          class="text-surface-900 dark:text-surface-0 text-2xl font-medium mb-2"
        >
          Page Not Found
        </h2>

        <!-- DESCRIPTION -->
        <p class="text-muted-color mb-6">
          Sorry, the page you are looking for doesn’t exist or has been moved.
        </p>

        <!-- ACTION -->
        <p-button
          label="Go to login"
          icon="pi pi-home"
          styleClass="w-full"
          routerLink="/login"
        ></p-button>

      </div>
    </div>
  </div>
</div>
