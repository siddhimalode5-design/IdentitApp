 

<div
  class="bg-surface-50 dark:bg-surface-950 flex items-center justify-center min-h-screen min-w-screen overflow-hidden"
>
  <div class="flex flex-col items-center justify-center">

    <!-- Gradient Wrapper -->
    <div
      style="
        border-radius: 56px;
        padding: 0.3rem;
        background: linear-gradient(
          180deg,
          var(--primary-color) 10%,
          rgba(33, 150, 243, 0) 30%
        );
      "
    >
      <!-- Card -->
      <div
        class="bg-surface-0 dark:bg-surface-900 px-10 py-12 text-center"
        style="border-radius: 53px; min-width: 420px; max-width: 480px"
      >

        <!-- ICON -->
        <i
          class="pi pi-envelope text-primary mb-4"
          style="font-size: 3.5rem"
        ></i>

        <!-- TITLE -->
        <h2
          class="text-surface-900 dark:text-surface-0 text-3xl font-medium mb-3"
        >
          Verify Your Email
        </h2>

        <!-- MESSAGE -->
        <p class="text-muted-color mb-4">
          We’ve sent a verification link to
        </p>

        <p class="font-medium text-surface-900 dark:text-surface-0 mb-4">
          {{ email }}
        </p>

        <p class="text-muted-color mb-6">
          Please check your inbox and click the link to activate your account.
        </p>

        <!-- SERVER MESSAGE -->
        <p-message
          *ngIf="serverMessage"
          severity="info"
          [text]="serverMessage"
          class="mb-4"
        ></p-message>

        <!-- ACTION -->
        <p-button
          label="Resend Email"
          icon="pi pi-refresh"
          styleClass="w-full p-button-secondary"
          [loading]="loading"
          (onClick)="resendEmail()"
        ></p-button>

      </div>
    </div>
  </div>
</div>
