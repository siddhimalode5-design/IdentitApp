<div class="mb-6">
  <h1 class="text-2xl font-semibold text-gray-800">
    Users Management
  </h1>
  <!-- <p class="text-sm text-gray-500">
    Manage registered users, lock accounts, and control access
  </p> -->
</div>

<p-card header="Users Management">
  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
  <div class="bg-white rounded-lg shadow p-4">
    <p class="text-sm text-gray-500">Total Users</p>
    <p class="text-2xl font-semibold">{{ totalUsers }}</p>
  </div>

  <div class="bg-white rounded-lg shadow p-4">
    <p class="text-sm text-gray-500">Active Users</p>
    <p class="text-2xl font-semibold text-green-600">
      {{ activeUsers }}
    </p>
  </div>

  <div class="bg-white rounded-lg shadow p-4">
    <p class="text-sm text-gray-500">Locked Users</p>
    <p class="text-2xl font-semibold text-red-600">
      {{ lockedUsers }}
    </p>
  </div>
</div>


<div class="flex items-center gap-3 mb-4">
  <span class="p-input-icon-left w-full max-w-sm">
    <i class="pi pi-search"></i>
    <input
  type="text"
  placeholder="Search by name or email"
  (input)="onSearchChange($event.target.value)"
/>

  </span>
</div>

  <p-table
    [value]="users"
    [paginator]="true"
    [rows]="10"
    responsiveLayout="scroll">

    <ng-template pTemplate="header">
      <tr>
        <th>Name</th>
        <th>Email</th>
        <th>Status</th>
        <th style="width: 200px">Actions</th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-user>
      <tr>
        <td>{{ user.firstName }} {{ user.lastName }}</td>
        <td>{{ user.email }}</td>

        <td>
          <p-tag
  [value]="user.isLocked ? 'Locked' : 'Active'"
  [severity]="user.isLocked ? 'danger' : 'success'">
</p-tag>

        </td>

       <td class="flex items-center gap-3">
  <!-- Lock / Unlock -->
  <button
  class="p-2 rounded-md hover:bg-gray-100 disabled:opacity-50"
  [pTooltip]="
    isSelf(user)
      ? 'You cannot lock your own account'
      : user.isLocked
        ? 'Unlock user'
        : 'Lock user'
  "
  tooltipPosition="top"
  [disabled]="isSelf(user)"
  (click)="toggleLock(user)"
>
  <i
    class="pi"
    [ngClass]="
      user.isLocked
        ? 'pi-unlock text-green-600'
        : 'pi-lock text-gray-600'
    "
  ></i>
</button>



<button
  class="p-2 rounded-md hover:bg-blue-50 disabled:opacity-50 disabled:cursor-not-allowed"
  [pTooltip]="isSelf(user) ? 'You cannot edit your own account' : 'Edit user details'"
  tooltipPosition="top"
  [disabled]="isSelf(user)"
  (click)="openEdit(user)">
  <i class="pi pi-pencil text-blue-600"></i>
</button>

      </tr>
    </ng-template>

  </p-table>

</p-card>
