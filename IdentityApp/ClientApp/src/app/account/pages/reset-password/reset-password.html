<app-floating-configurator />

<div
  class="bg-surface-50 dark:bg-surface-950 flex items-center justify-center min-h-screen min-w-screen overflow-hidden"
>
  <div class="flex flex-col items-center justify-center">

    <!-- Gradient Border Wrapper -->
    <div
      style="
        border-radius: 56px;
        padding: 0.3rem;
        background: linear-gradient(
          180deg,
          var(--primary-color) 10%,
          rgba(33, 150, 243, 0) 30%
        );
      "
    >
      <!-- Card -->
      <div
        class="w-full bg-surface-0 dark:bg-surface-900 py-12 px-8 sm:px-12"
        style="border-radius: 53px; min-width: 420px; max-width: 480px"
      >

        <!-- HEADER -->
        <div class="text-center mb-6">
          <h2
            class="text-surface-900 dark:text-surface-0 text-3xl font-medium mb-2"
          >
            Reset Password
          </h2>
          <span class="text-muted-color">
            Enter your new password
          </span>
        </div>

        <!-- ERROR -->
        <p-message
          *ngIf="error"
          severity="error"
          [text]="error"
          class="mb-4"
        ></p-message>

        <!-- FORM -->
        <form
          [formGroup]="form"
          (ngSubmit)="submit()"
          class="flex flex-col gap-4"
        >

          <!-- NEW PASSWORD -->
          <div class="flex flex-col gap-1">
            <label class="font-medium">New Password</label>
            <p-password
              formControlName="password"
              placeholder="New password"
              [toggleMask]="true"
              [feedback]="true"
              styleClass="w-full"
              inputStyleClass="w-full"
            ></p-password>
          </div>

          <!-- CONFIRM PASSWORD -->
          <div class="flex flex-col gap-1">
            <label class="font-medium">Confirm Password</label>
            <p-password
              formControlName="confirmPassword"
              placeholder="Confirm password"
              [toggleMask]="true"
              [feedback]="false"
              styleClass="w-full"
              inputStyleClass="w-full"
            ></p-password>
          </div>

          <!-- VALIDATION -->
          <small
            class="p-error text-center"
            *ngIf="form.errors?.['notMatching'] && form.touched"
          >
            Passwords do not match
          </small>

          <!-- SUBMIT -->
          <p-button
            label="Reset Password"
            type="submit"
            styleClass="w-full"
            [loading]="loading"
            [disabled]="form.invalid"
          ></p-button>

        </form>

      </div>
    </div>
  </div>
</div>
