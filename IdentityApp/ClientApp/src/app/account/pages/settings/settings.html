<div class="max-w-3xl space-y-6">
  <!-- ACCOUNT INFO -->
  <div class="bg-white rounded-xl border border-gray-200 p-6 shadow-sm">
    <h3 class="text-xl font-semibold mb-6 flex items-center gap-2 text-gray-800">
      <i class="pi pi-user text-green-500"></i>
      Account Information
    </h3>

    <div class="space-y-5">
      <div class="grid grid-cols-[160px_1fr]">
        <span class="text-gray-500 font-medium">Email</span>
        <span class="font-semibold">{{ user.email }}</span>
      </div>

      <hr>

      <div class="grid grid-cols-[160px_1fr]">
        <span class="text-gray-500 font-medium">Role</span>
        <span class="font-semibold">{{ user.roles?.join(', ') }}</span>
      </div>

      <hr>

      <div class="grid grid-cols-[160px_1fr]">
        <span class="text-gray-500 font-medium">Status</span>
        <span class="text-green-600 font-semibold">Active</span>
      </div>
    </div>
  </div>

  <!-- SECURITY -->
  <div class="bg-white rounded-xl border p-6 shadow-sm">
    <h3 class="text-lg font-semibold mb-4 flex items-center gap-2">
      <i class="pi pi-shield text-blue-500"></i>
      Security
    </h3>

    <button
      (click)="openChangePassword()"
      class="w-full flex justify-between items-center px-4 py-3 rounded-lg border border-blue-200 bg-blue-50 text-blue-700 hover:bg-blue-100">
      <span class="flex items-center gap-2">
        <i class="pi pi-key"></i>
        Change Password
      </span>
      <i class="pi pi-chevron-right"></i>
    </button>
  </div>
</div>

<!-- CHANGE PASSWORD MODAL -->
<div *ngIf="showChangePassword"
     class="fixed inset-0 bg-black/40 flex items-center justify-center z-50">

  <div class="bg-white rounded-xl w-full max-w-md p-6">
    <div class="flex justify-between mb-4">
      <h3 class="text-lg font-semibold">Change Password</h3>
      <button (click)="closeChangePassword()">
        <i class="pi pi-times"></i>
      </button>
    </div>

    <form (ngSubmit)="changePassword()" class="space-y-4">
      <input
        type="password"
        placeholder="Current Password"
        [(ngModel)]="passwordForm.currentPassword"
        name="currentPassword"
        required
        class="w-full border px-3 py-2 rounded-lg" />

      <input
        type="password"
        placeholder="New Password"
        [(ngModel)]="passwordForm.newPassword"
        name="newPassword"
        required
        class="w-full border px-3 py-2 rounded-lg" />

      <input
        type="password"
        placeholder="Confirm New Password"
        [(ngModel)]="passwordForm.confirmPassword"
        name="confirmPassword"
        required
        class="w-full border px-3 py-2 rounded-lg" />

      <p *ngIf="error" class="text-red-600 text-sm">{{ error }}</p>
      <p *ngIf="success" class="text-green-600 text-sm">
  {{ success }}
</p>


      <div class="flex justify-end gap-3">
        <button type="button" (click)="closeChangePassword()" class="border px-4 py-2 rounded-lg">
          Cancel
        </button>

        <button type="submit"
                [disabled]="loading"
                class="bg-blue-600 text-white px-4 py-2 rounded-lg">
          {{ loading ? 'Updating...' : 'Update Password' }}
        </button>
      </div>
    </form>
  </div>
</div>
