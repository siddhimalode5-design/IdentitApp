<app-floating-configurator />

<div
  class="bg-surface-50 dark:bg-surface-950 flex items-center justify-center min-h-screen min-w-screen overflow-hidden"
>
  <div class="flex flex-col items-center justify-center">

    <!-- Gradient Wrapper -->
    <div
      style="
        border-radius: 56px;
        padding: 0.3rem;
        background: linear-gradient(
          180deg,
          var(--primary-color) 10%,
          rgba(33, 150, 243, 0) 30%
        );
      "
    >
      <!-- Card -->
      <div
        class="w-full bg-surface-0 dark:bg-surface-900 py-12 px-8 sm:px-12"
        style="border-radius: 53px; min-width: 420px; max-width: 480px"
      >
        <!-- HEADER -->
        <div class="text-center mb-6">
          <h2 class="text-surface-900 dark:text-surface-0 text-3xl font-medium mb-2">
            Forgot Password
          </h2>
          <span class="text-muted-color">
            Enter your email and we’ll send you a reset link
          </span>
        </div>

        <!-- FORM -->
        <form
          [formGroup]="form"
          (ngSubmit)="submit()"
          class="flex flex-col gap-4"
        >
          <!-- EMAIL -->
          <div class="flex flex-col gap-1">
            <label class="font-medium">Email</label>
            <input
              pInputText
              type="email"
              formControlName="email"
              placeholder="Enter registered email"
            />

            <small
              class="p-error"
              *ngIf="form.get('email')?.touched && form.get('email')?.invalid"
            >
              Valid email is required
            </small>
          </div>

          <!-- SUBMIT -->
          <p-button
            type="submit"
            label="Send Reset Link"
            icon="pi pi-envelope"
            styleClass="w-full"
            [loading]="loading"
            [disabled]="form.invalid"
          ></p-button>

          <!-- BACK TO LOGIN -->
          <p class="text-center text-600">
            <a routerLink="/login" class="font-medium text-primary cursor-pointer">
              Back to Login
            </a>
          </p>
        </form>
      </div>
    </div>
  </div>
</div>
